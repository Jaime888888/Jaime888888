<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Jaime Martin — Software Engineer</title>
  <desc id="desc">An editorial dark green and warm amber banner for Jaime Martin, a software engineer and USC computer engineering and computer science student.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9bc5bd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="310" rx="22" fill="#0b1517"/>
  <rect width="1200" height="310" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="13" height="310" rx="7" fill="#f0b56b"/>

  <g opacity="0.82">
    <path d="M760 0L1200 0V310H935Z" fill="#102a2a"/>
    <path d="M868 0H1200V310H1044Z" fill="#163b38"/>
    <path d="M1035 0H1200V310H1135Z" fill="#f0b56b" fill-opacity="0.1"/>
  </g>

  <g transform="translate(60 50)">
    <rect width="58" height="58" rx="10" fill="#f0b56b"/>
    <text x="29" y="39" text-anchor="middle" fill="#0b1517" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">JM</text>
  </g>

  <text x="138" y="72" fill="#9bc5bd" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3.5">SOFTWARE ENGINEER</text>
  <text x="59" y="157" fill="#f5efe3" font-family="Segoe UI, Arial, sans-serif" font-size="61" font-weight="760" letter-spacing="1.5">JAIME MARTIN</text>
  <rect x="60" y="178" width="118" height="5" rx="2.5" fill="#f0b56b"/>
  <text x="60" y="221" fill="#c8d7d2" font-family="Segoe UI, Arial, sans-serif" font-size="21">Computer Engineering + Computer Science at USC</text>
  <text x="60" y="260" fill="#87aaa4" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="1">LOS ANGELES  /  DECEMBER 2026  /  OPEN TO SWE ROLES</text>

  <g transform="translate(845 55)" filter="url(#shadow)">
    <rect width="292" height="200" rx="15" fill="#0d1d1f" stroke="#4d7771" stroke-opacity="0.62"/>
    <circle cx="24" cy="23" r="4" fill="#f0b56b"/>
    <circle cx="39" cy="23" r="4" fill="#557873"/>
    <circle cx="54" cy="23" r="4" fill="#557873"/>
    <path d="M18 42H274" stroke="#365a55" stroke-opacity="0.6"/>

    <text x="22" y="78" fill="#f0b56b" font-family="Consolas, monospace" font-size="13">01</text>
    <text x="58" y="78" fill="#e7ede8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Build the product</text>
    <text x="22" y="121" fill="#f0b56b" font-family="Consolas, monospace" font-size="13">02</text>
    <text x="58" y="121" fill="#e7ede8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Ship measurable value</text>
    <text x="22" y="164" fill="#f0b56b" font-family="Consolas, monospace" font-size="13">03</text>
    <text x="58" y="164" fill="#e7ede8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Improve the system</text>

    <rect x="22" y="181" width="120" height="3" rx="1.5" fill="#f0b56b"/>
    <rect x="148" y="181" width="54" height="3" rx="1.5" fill="#4d7771"/>

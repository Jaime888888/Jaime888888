<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jaime Martin — Software Engineer</title>
  <desc id="desc">A dark blue and violet banner introducing Jaime Martin as a software engineer focused on full-stack products, intelligent systems, and interactive simulations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.54" stop-color="#102a4c"/>
      <stop offset="1" stop-color="#342066"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.48"/>
      <stop offset="0.52" stop-color="#20c8d8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6ff"/>
      <stop offset="1" stop-color="#a88cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8c7ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <g opacity="0.42" fill="none" stroke="url(#accent)">
    <circle cx="1010" cy="92" r="164"/>
    <circle cx="1010" cy="92" r="116" stroke-opacity="0.64"/>
    <circle cx="1010" cy="92" r="68" stroke-opacity="0.42"/>
    <path d="M820 228C910 134 1020 160 1160 58" stroke-width="2"/>
    <path d="M864 270C940 198 1050 216 1188 128" stroke-opacity="0.5"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="56" height="56" rx="14" fill="#0a1d34" stroke="#54d6ff" stroke-opacity="0.72"/>
    <path d="M82 79l-9 7 9 7M102 79l9 7-9 7M96 73l-8 26" fill="none" stroke="#82e7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="144" y="91" fill="#dce9ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="4">SOFTWARE ENGINEER</text>
  <text x="64" y="174" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="2">JAIME MARTIN</text>
  <rect x="65" y="196" width="420" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="238" fill="#c7d8ef" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22">Full-stack products · intelligent systems · interactive simulations</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">
    <rect x="64" y="266" width="92" height="30" rx="15" fill="#54d6ff" fill-opacity="0.14" stroke="#54d6ff" stroke-opacity="0.44"/>
    <text x="86" y="286" fill="#9deaff">BUILD</text>
    <rect x="168" y="266" width="86" height="30" rx="15" fill="#8f78ff" fill-opacity="0.14" stroke="#a88cff" stroke-opacity="0.44"/>
    <text x="192" y="286" fill="#cbbdff">SHIP</text>
    <rect x="266" y="266" width="116" height="30" rx="15" fill="#54d6ff" fill-opacity="0.1" stroke="#7fdff0" stroke-opacity="0.35"/>
    <text x="289" y="286" fill="#aeeaf2">ITERATE</text>
  </g>
</svg>

